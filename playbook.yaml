- name: Playbook to create capi mgmt cluster infra
  hosts: localhost
  gather_facts: true
  vars:
    os_endpoint_type: public
    os_interface: "{{ os_endpoint_type }}"
    os_username: admin
    os_project_name: admin
    os_tenant_name: '{{ os_project_name }}'
    os_auth_type: password
    os_auth_url: https://keystone.lab.local/v3
    os_user_domain_name: default
    os_project_domain_name: "{{ os_user_domain_name }}"
    os_region_name: RegionOne
    os_identity_api_version: 3
    os_auth_version: 3
    nova_endpoint_type: "{{ os_endpoint_type }}"
  environment:
    OS_ENDPOINT_TYPE: "{{ os_endpoint_type }}"
    OS_INTERFACE: "{{ os_interface}}"
    OS_USERNAME: "{{ os_username }}"
    OS_PASSWORD: "{{ os_password }}"
    OS_PROJECT_NAME: "{{ os_project_name}}"
    OS_TENANT_NAME: 'admin'
    OS_AUTH_TYPE: password
    OS_AUTH_URL: "{{ os_auth_url }}"
    OS_USER_DOMAIN_NAME: "{{ os_user_domain_name }}"
    OS_PROJECT_DOMAIN_NAME: "{{ os_project_domain_name }}"
    OS_REGION_NAME: "{{ os_region_name }}"
    OS_IDENTITY_API_VERSION: "{{ os_identity_api_version }}"
    OS_AUTH_VERSION: "{{ os_auth_version }}"
    NOVA_ENDPOINT_TYPE: "{{ nova_endpoint_type }}"
  roles:
    - capi_mgmt_cluster

- name: Playbook to deploy kubernetes cluster on capi mgmt cluster vms
  hosts: capi_mgmt_bootstrp_vm
  gather_facts: true
  become: true
  tasks:
    - name: ping the new host
      ansible.builtin.ping:

    - name: clone the kubespray repo on the bootstrap node
      ansible.builtin.git:
        repo: https://github.com/kubernetes-sigs/kubespray.git
        dest: /opt/kubespary
