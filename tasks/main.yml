---
# tasks file for capi_mgmt_cluster

- import_tasks: capi_mgmt_network_tasks.yml

- import_tasks: capi_mgmt_secgroup_tasks.yml

- import_tasks: capi_mgmt_img_flavor_tasks.yml

- import_tasks: capi_mgmt_keypair_tasks.yml

- include_tasks: capi_mgmt_volume_tasks.yml
  when: (capi_boot_from_volume | bool)

- import_tasks: capi_mgmt_lb_tasks.yml

- include_tasks: capi_mgmt_instance_tasks_bfv.yml
  when: (capi_boot_from_volume | bool)

- include_tasks: capi_mgmt_instance_tasks_bfi.yml
  when: not (capi_boot_from_volume | bool)

- include_tasks: capi_mgmt_floatingip_tasks.yml
  when: (create_tunnelled_network_infra | bool)

- import_tasks: capi_mgmt_additional_tasks.yml
  tags:
    - capi-mgmt-cluster-additional
